# Install as /etc/systemd/journald.conf.d/60-rardar-runtime.conf.
# This is deliberately host-wide: the current host already uses persistent
# journald and a 256M global cap would immediately discard unrelated operator
# evidence.  Three GiB bounds the measured 2.6 GiB baseline without an unsafe
# one-time purge; the 14-day ceiling and 8 GiB reserve match Rardar's storage
# guard while preserving other system services.
[Journal]
Storage=persistent
Compress=yes
MaxRetentionSec=14day
SystemMaxUse=3G
SystemMaxFileSize=128M
SystemKeepFree=8G
