name: Release Artifact

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-artifact-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build exact Linux release artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXACT_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - name: Check out exact verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind builder to successful Verify identity
        shell: bash
        run: |
          set -euo pipefail
          test "${#EXACT_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "${{ github.event.workflow_run.head_sha }}" = "$EXACT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install isolated builder dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python -m venv .venv-release-builder
          .venv-release-builder/bin/python -m pip install --disable-pip-version-check -r requirements.lock
          .venv-release-builder/bin/python -m pip check

      - name: Run complete Verify gate
        shell: bash
        env:
          RARDAR_PYTHON: ${{ github.workspace }}/.venv-release-builder/bin/python
          RARDAR_VITE_CACHE_DIR: ${{ runner.temp }}/verify-vite-cache
        run: npm run verify

      - name: Produce final build output
        shell: bash
        env:
          RARDAR_VITE_CACHE_DIR: ${{ runner.temp }}/release-vite-cache
        run: npm run build

      - name: Build offline Python wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wheelhouse
          mkdir wheelhouse
          .venv-release-builder/bin/python -m pip wheel \
            --disable-pip-version-check \
            --requirement requirements.lock \
            --wheel-dir wheelhouse

      - name: Stage and package exact release
        shell: bash
        run: |
          set -euo pipefail
          release_stage="$RUNNER_TEMP/rardar-release-stage"
          release_output="$RUNNER_TEMP/rardar-release-output"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm_version="$(npm --version)"
          python -m pipeline.release_package build \
            --source-root "$GITHUB_WORKSPACE" \
            --stage-root "$release_stage" \
            --output-directory "$release_output" \
            --commit-sha "$EXACT_SHA" \
            --verify-workflow-run-id "$VERIFY_RUN_ID" \
            --verify-workflow-head-sha "$EXACT_SHA" \
            --npm-version "$npm_version" \
            --built-at "$built_at" \
            | tee "$RUNNER_TEMP/release-build.json"

      - name: Accept fresh extraction without npm
        shell: bash
        run: |
          set -euo pipefail
          release_output="$RUNNER_TEMP/rardar-release-output"
          release_accept="$RUNNER_TEMP/rardar-release-accept"
          release_venv="$RUNNER_TEMP/rardar-release-venv"
          archive="$release_output/rardar-release-$EXACT_SHA-linux-x86_64.tar.gz"
          checksum="$archive.sha256"
          (
            cd "$release_output"
            sha256sum --check "$(basename "$checksum")"
          )
          python -m pipeline.release_package accept \
            --archive "$archive" \
            --checksum "$checksum" \
            --extract-root "$release_accept" \
            --expected-sha "$EXACT_SHA" \
            | tee "$RUNNER_TEMP/release-accept.json"
          (
            cd "$release_accept"
            python -m pipeline.release_artifact verify \
              --release-root . \
              --expected-sha "$EXACT_SHA" \
              --check-host
          )
          python -m venv "$release_venv"
          "$release_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links "$release_accept/wheelhouse" \
            --requirement "$release_accept/requirements.lock"
          "$release_venv/bin/python" -m pip check
          node "$release_accept/node_modules/vite/bin/vite.js" --version
          node "$release_accept/node_modules/vinext/dist/cli.js" --version

      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rardar-release-output/rardar-release-$EXACT_SHA-linux-x86_64.tar.gz"
          {
            echo "### Exact Rardar release"
            echo "- Commit: \`$EXACT_SHA\`"
            echo "- Verify workflow run: \`$VERIFY_RUN_ID\`"
            echo "- Archive bytes: \`$(stat --format=%s "$archive")\`"
            echo "- Archive SHA-256: \`$(cut -d' ' -f1 "$archive.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rardar-release-${{ github.event.workflow_run.head_sha }}-linux-x86_64
          path: |
            ${{ runner.temp }}/rardar-release-output/rardar-release-${{ github.event.workflow_run.head_sha }}-linux-x86_64.tar.gz
            ${{ runner.temp }}/rardar-release-output/rardar-release-${{ github.event.workflow_run.head_sha }}-linux-x86_64.tar.gz.sha256
            ${{ runner.temp }}/rardar-release-output/release-manifest.json
          if-no-files-found: error
          retention-days: 10
          compression-level: 0
